<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle Carros</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10243A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Controle Carros">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bloqueio" id="bloqueio">
  <div class="bloqueio-cartao" id="cartaoLogin">
    <div class="bloqueio-icone">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5a3 3 0 0 1 6 0"/><path d="M6 8v-.5a6 6 0 0 1 12 0V8"/><rect x="4" y="8" width="16" height="12" rx="3"/><circle cx="12" cy="13.5" r="1.6"/><path d="M12 15.1V17"/></svg>
    </div>
    <h1>Controle Carros</h1>
    <p id="bloqueioTexto">Entre com seu e-mail e senha.</p>
    <form id="loginForm" style="text-align:left">
      <label for="loginEmail">E-mail</label>
      <input id="loginEmail" type="email" inputmode="email" autocomplete="username"
             autocapitalize="none" autocorrect="off" required>
      <label for="loginSenha">Senha</label>
      <input id="loginSenha" type="password" autocomplete="current-password" required>
      <button class="btn btn-largo" type="submit" id="loginBtn" style="margin-top:18px">Entrar</button>
    </form>
    <p class="bloqueio-nota" id="bloqueioNota"></p>
  </div>

  <div class="bloqueio-cartao oculto" id="cartaoPin">
    <div class="bloqueio-icone">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5a3 3 0 0 1 6 0"/><path d="M6 8v-.5a6 6 0 0 1 12 0V8"/><rect x="4" y="8" width="16" height="12" rx="3"/><circle cx="12" cy="13.5" r="1.6"/><path d="M12 15.1V17"/></svg>
    </div>
    <h1 id="pinTitulo">Digite seu código</h1>
    <p class="bloqueio-sub" id="pinSub">Código de 4 números pra entrar</p>
    <div class="pin-pontos" id="pinPontos"><i></i><i></i><i></i><i></i></div>
    <div class="pin-teclado" id="pinTeclado">
      <button type="button">1</button>
      <button type="button">2</button>
      <button type="button">3</button>
      <button type="button">4</button>
      <button type="button">5</button>
      <button type="button">6</button>
      <button type="button">7</button>
      <button type="button">8</button>
      <button type="button">9</button>
      <span class="pin-vazio"></span>
      <button type="button">0</button>
      <button type="button" id="pinApaga" aria-label="Apagar último número">⌫</button>
    </div>
    <button type="button" class="pin-link" id="pinLink">Esqueci meu código</button>
    <p class="bloqueio-nota" id="pinNota"></p>
  </div>
</div>

<div id="appConteudo" class="oculto">
<header>
  <div class="semana-nav">
    <button class="seta" id="semAnt" aria-label="Semana anterior">‹</button>
    <div style="text-align:center">
      <div class="semana-label" id="semRotulo">Semana atual</div>
      <div class="semana-titulo" id="semTitulo">—</div>
    </div>
    <button class="seta" id="semProx" aria-label="Semana seguinte">›</button>
  </div>
  <div class="topo-acoes">
    <button class="btn-sync" id="btnSync">Atualizar</button>
    <button class="btn-sync" id="btnCodigo">Código</button>
    <button class="btn-sync" id="btnSair">Sair</button>
  </div>
</header>
<div class="resumo" id="resumo"></div>
<main id="conteudo" aria-live="polite"></main>

<div class="fundo" id="fundo"></div>
<div class="painel" id="painel" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<nav>
  <button data-aba="semana" class="ativo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Semana
  </button>
  <button data-aba="carros">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15.5V12l1.8-4.4A2 2 0 0 1 7.6 6.3h8.8a2 2 0 0 1 1.8 1.3L20 12v3.5"/><path d="M4.5 12h15"/><circle cx="7.5" cy="16.6" r="1.8"/><circle cx="16.5" cy="16.6" r="1.8"/><path d="M9.3 16.6h5.4"/></svg>
    Carros
  </button>
  <button data-aba="manutencao">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.6 3.4a5 5 0 0 0-6 6.6l-5.5 5.5a2.2 2.2 0 0 0 3.1 3.1l5.5-5.5a5 5 0 0 0 6.6-6l-2.9 2.9-2.6-.6-.6-2.6z"/></svg>
    Manutenção
  </button>
  <button data-aba="balanco">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7.5 20v-5.5M12 20V7.5M16.5 20v-8.5"/></svg>
    Balanço
  </button>
</nav>
</div>

<script src="app.js"></script>
</body>
</html>
